<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#1f2937">
        <title>Offline | Antrian Pasien</title>
        <style>
            body { align-items: center; background: #f3f4f6; color: #1f2937; display: flex; font: 16px/1.6 system-ui, sans-serif; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; }
            main { background: white; border-radius: 12px; box-shadow: 0 4px 12px #00000012; max-width: 32rem; padding: 32px; text-align: center; }
            h1 { font-size: 1.5rem; margin: 0 0 12px; }
            p { margin: 0 0 20px; }
            button { background: #1f2937; border: 0; border-radius: 6px; color: white; cursor: pointer; font: inherit; font-weight: 600; min-height: 48px; padding: 8px 20px; }
        </style>
    </head>
    <body>
        <main>
            <h1>Koneksi internet terputus</h1>
            <p>Halaman pendaftaran memerlukan koneksi internet. Notifikasi giliran tetap dapat muncul jika Web Push sudah diaktifkan.</p>
            <button type="button" onclick="window.location.reload()">Coba lagi</button>
        </main>
    </body>
</html>
